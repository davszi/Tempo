[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-ml"
version = "0.1.0"
description = "TEMPO ML: synthetic clients, dataset generation, FSRS-6 training and evaluation"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["scipy>=1.11", "pandas>=2.1", "torch>=2.4"]
# py-fsrs supplies reference-formula tests and the A1 optimizer arm; torch the trainer's exact gradients.
test = ["pytest>=8", "scipy>=1.11", "pandas>=2.1", "torch>=2.4", "fsrs[optimizer]==6.3.2"]

[tool.setuptools.packages.find]
include = ["tempo_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
