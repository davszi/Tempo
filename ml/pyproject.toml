[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-ml"
version = "0.1.0"
description = "TEMPO ML: synthetic clients, dataset generation, FSRS-6 training and evaluation"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["scipy>=1.11", "pandas>=2.1"]
# fsrs (py-fsrs) is only used to check the FSRS-6 formulas against the reference package.
test = ["pytest>=8", "scipy>=1.11", "pandas>=2.1", "fsrs==6.3.2"]

[tool.setuptools.packages.find]
include = ["tempo_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
