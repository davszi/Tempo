  if (r == null) return `<span class="ring new" style="width:${size}px;height:${size}px" title="Not tested yet"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="track"/></svg><b>new</b></span>`;
  const p = Math.round(r * 100), cls = r >= store.retention ? "ok" : r >= store.retention - 0.1 ? "mid" : "low";
  return `<span class="ring ${cls}" style="width:${size}px;height:${size}px" title="${p}% chance you recall it now"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="track"/><circle cx="22" cy="22" r="18" class="val" stroke-dasharray="${(r * c).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${p}%</b></span>`;
}
function memCard(e) {
  const l = LINE_BY_ID.get(e.lineId), d = dueLabel(e), due = e.card.due <= now();
  return `<div class="mcard ${due ? "due" : ""}">${ring(e)}
    <span class="mc-text"><b>${esc(l.label)}</b><small>${esc(l.family.name)} · ${sideName(e.side)}</small><span class="chip ${d.cls}" title="${esc(d.long)}">${d.text}</span></span>
    <button class="btn sm ${due ? "primary" : "ghost"}" data-act="review" data-key="${e.key}">${due ? "Review" : "Practise"}</button></div>`;
}

/* The schedule view of OPEN.md to-do 4 and the "fading soonest" list in one card:
   30 days of reviews, today and overdue highlighted; pick a day to list its lines with days until forgetting. */
function memoryTimeline(entries) {
  const today = dayStart(now()), N = 30, target = Math.round(store.retention * 100);
  const days = [...Array(N)].map((_, i) => {
    const d = today + i * DAY;
    const list = entries.filter((e) => (i === 0 ? e.card.due < d + DAY : dayStart(e.card.due) === d)).sort((a, b) => a.card.due - b.card.due);
    return { i, d, list, late: i === 0 ? list.filter((e) => e.card.due < today).length : 0 };
  });
  const week = days.slice(1, 7).reduce((n, x) => n + x.list.length, 0);
  const after = entries.filter((e) => e.card.due >= today + N * DAY).length;
  const max = Math.max(4, ...days.map((x) => x.list.length));
  const sel = ui.tlDay == null ? null : days.find((x) => x.d === ui.tlDay) || null;
  const strip = `<div class="tl-wrap"><div class="tl">${days.map((x) => {
    const n = x.list.length, onTime = n - x.late, dow = new Date(x.d).getDay();
    const bars = n ? `${x.late ? `<i class="late" style="height:${x.late / max * 100}%"></i>` : ""}${onTime ? `<i style="height:${onTime / max * 100}%"></i>` : ""}` : `<i class="zero"></i>`;
    const label = x.i === 0 ? "Today" : dow === 1 ? fmtDate(x.d, { day: "numeric", month: "short" }) : "";
    return `<button class="tl-day ${x.i === 0 ? "today" : ""} ${sel && sel.d === x.d ? "on" : ""} ${dow === 0 || dow === 6 ? "we" : ""} ${n ? "has" : ""}" data-act="tl-day" data-d="${x.d}" title="${x.i === 0 ? "Today" : fmtDate(x.d)}: ${plural(n, "line")}${x.late ? `, ${x.late} overdue` : ""}" ${entries.length ? "" : "tabindex=\"-1\""}>
      <span class="tl-n">${n || ""}</span><span class="tl-bar">${bars}</span><small>${label}</small></button>`;
  }).join("")}</div></div>`;
  const due = days[0].list.length;
  const summary = entries.length
    ? `<div class="mem-sum"><span><b>${due}</b> today</span><span><b>${week}</b> rest of the week</span><span><b>${entries.length - due - week - after}</b> later this month</span>${after ? `<span><b>${after}</b> after 30 days</span>` : ""}</div>`
    : "";
  const head = `<div class="mem-head"><div><p class="eyebrow">MEMORY TIMELINE</p><h2>When each line starts to fade</h2>
      <p>Each line sits on the day its predicted recall drops below ${target}%, which is when TEMPO brings it back.</p></div>${summary}</div>`;
  if (!entries.length) {
    return `<section class="card mem mem-empty">${head}${strip}
      <div class="empty"><h3>Your timeline is empty</h3>Learn a line and it lands here on the day you're likely to start forgetting it.<br><button class="btn primary" data-go="#/learn">${icon("book", 16)} Learn your first line</button></div></section>`;
  }
  const shown = sel ? sel.list : [...entries].sort((a, b) => a.card.due - b.card.due).slice(0, 6);
  const title = sel ? (sel.i === 0 ? "Today" : fmtDate(sel.d, { weekday: "long", day: "numeric", month: "long" })) : "Fading soonest";
  return `<section class="card mem">${head}${strip}
    <div class="mem-list-head"><h3>${title}</h3><span class="chip plain">${plural(shown.length, "line")}</span><span class="spacer"></span>
      ${sel ? `<button class="btn sm ghost" data-act="tl-day" data-d="">${icon("back", 14)} Fading soonest</button>` : `<span class="muted small">Tap a day to see its lines</span>`}</div>
    ${shown.length ? `<div class="mgrid">${shown.map(memCard).join("")}</div>` : `<div class="empty">No reviews on this day.</div>`}
  </section>`;
}

function familyStats(f) {
  const learned = f.lines.filter((l) => isLearned(l.id)).length;
  const prog = f.lines.filter((l) => progressFor(l.id).length).length;
  return { learned, prog };
}
function viewLearn() {
  const q = ui.learnQuery.trim().toLowerCase();
  const cards = FAMILIES.map((f) => {
    const nameHit = !q || f.name.toLowerCase().includes(q) || f.eco.toLowerCase().includes(q);
    const lineHits = q ? f.lines.filter((l) => l.label.toLowerCase().includes(q) || l.eco.toLowerCase() === q).length : 0;
    return { f, nameHit, lineHits, ...familyStats(f) };
  }).filter((x) => (x.nameHit || x.lineHits) && (store.side === "all" || x.f.side === store.side));
  return `<header class="page-head"><p class="eyebrow">LEARNING MODE</p><h1>Build your repertoire.</h1>
    <p class="lead">Every opening family in the TEMPO library. Open one to see all of its variations, pick a line, and follow the arrows on the board.</p></header>
  <div class="controls">
    <label class="search">${icon("search")}<span class="sr">Search openings</span><input id="learn-q" type="search" placeholder="Search openings, variations or ECO codes" value="${esc(ui.learnQuery)}" data-input="learnQuery" autocomplete="off"></label>
    <div class="seg" role="tablist" aria-label="Which side do you play">${[["all", "All openings", ""], ["white", "I play White", "white"], ["black", "I play Black", "black"]].map(([v, t, dot]) => `<button role="tab" aria-selected="${store.side === v}" class="${store.side === v ? "on" : ""}" data-act="side-filter" data-v="${v}">${dot ? `<span class="side-dot ${dot}"></span>` : ""}${t}<span class="n">${v === "all" ? FAMILIES.length : FAMILIES.filter((f) => f.side === v).length}</span></button>`).join("")}</div>
  </div>
  <p class="result-count">${cards.length} ${store.side === "all" ? "" : `${sideName(store.side)} `}opening ${cards.length === 1 ? "family" : "families"} · ${cards.reduce((n, x) => n + x.f.lines.length, 0).toLocaleString()} lines to learn</p>
  ${cards.length ? `<div class="fam-grid">${cards.map(({ f, lineHits, learned, prog }) => {
    const pos = positions(f.root)[Math.min(6, f.root.uci.length)];
    return `<button class="fam" data-go="#/family/${f.i}">
      ${boardHTML(pos, { mini: true, flipped: chosenSide(f) === "black" })}
      <div class="fam-body"><h3>${esc(f.name)}</h3>
        <div class="fam-meta"><span>${plural(f.lines.length, "line")}</span><span>${f.eco}</span><span class="side-tag"><span class="side-dot ${f.side}"></span>${sideName(f.side)}</span></div>
        ${lineHits ? `<span class="chip">${plural(lineHits, "matching line")}</span>` : ""}
        <div class="fam-progress"><span class="bar"><i style="width:${Math.round(learned / f.lines.length * 100)}%"></i></span><span>${learned}/${f.lines.length}</span></div>
        ${prog ? `<span class="chip warn">${prog} in progress</span>` : ""}
      </div></button>`;
  }).join("")}</div>` : `<div class="empty"><h3>No openings match</h3>Try another name, a variation, or an ECO code such as C50.</div>`}`;
}

function lineStatus(line) {
  const prog = progressFor(line.id);
  if (isLearned(line.id)) return `<span class="chip">${icon("check", 12)} Learned</span>`;
  if (prog.length) return `<span class="chip warn">${prog[0].ply}/${prog[0].total}</span>`;
  return "";
}
/* A line's name, plus the moves that tell it apart when another learnable line of the family has the same name. */
function altMoves(l) {
  if (l.alt === undefined) {
    const twins = l.family.lines.filter((x) => x !== l && x.label === l.label);
    if (!twins.length) l.alt = "";
    else {
      const shared = Math.max(...twins.map((t) => { let k = 0; while (k < l.uci.length && t.uci[k] === l.uci[k]) k++; return k; }));
      l.alt = moveText(l, Math.min(shared, l.uci.length - 1), Math.min(l.uci.length, shared + 3));
    }
  }
  return l.alt;
}
const lineTitle = (l) => `${esc(l.label)}${altMoves(l) ? ` <span class="alt">${esc(altMoves(l))}</span>` : ""}`;

/* Opening family: the board with the chosen line on the left, every learnable variation on the right. */
function viewFamily(idx) {
  const f = FAMILIES[Number(idx)];
  if (!f) return `<div class="empty">Opening not found. <button class="btn ghost" data-go="#/learn">Back to openings</button></div>`;
  if (ui.famFor !== f.i) { ui.famFor = f.i; ui.famQuery = ""; }
  const q = ui.famQuery.trim().toLowerCase();
  const list = f.lines.filter((l) => !q || l.label.toLowerCase().includes(q) || l.eco.toLowerCase().includes(q) || moveText(l).toLowerCase().includes(q));
  let sel = LINE_BY_ID.get(ui.selected);
  if (!sel || sel.family !== f || !sel.learnable) sel = f.lines.find((l) => !isLearned(l.id)) || f.lines[0];
  ui.selected = sel.id;
  const side = chosenSide(f);
  const prog = store.progress[keyOf(sel.id, side)];
  const learned = store.rep[keyOf(sel.id, side)];
  const { learned: nLearned, prog: nProg } = familyStats(f);
  const actions = prog
    ? `<button class="btn primary" data-act="learn" data-line="${sel.id}" data-side="${side}">${icon("play", 16)} Continue (${prog.ply}/${prog.total})</button>
       <button class="btn ghost" data-act="learn-restart" data-line="${sel.id}" data-side="${side}">${icon("restart", 16)} Start over</button>`
    : learned
      ? `<button class="btn primary" data-act="review" data-key="${learned.key}">${icon("repeat", 16)} Review without hints</button>
         <button class="btn ghost" data-act="learn-restart" data-line="${sel.id}" data-side="${side}">${icon("book", 16)} Learn again</button>`
      : `<button class="btn primary" data-act="learn-restart" data-line="${sel.id}" data-side="${side}">${icon("play", 16)} Start learning as ${sideName(side)}</button>`;
  return `<button class="back" data-go="#/learn">${icon("back", 16)} All openings</button>
  <header class="page-head fam-head"><div><p class="eyebrow">OPENING FAMILY · ${f.eco}</p><h1>${esc(f.name)}</h1>
    <p class="lead">${plural(f.lines.length, "line")} to learn · ${nLearned} learned${nProg ? ` · ${nProg} in progress` : ""}</p></div>
    <span class="side-badge"><span class="side-dot ${f.side}"></span>You play ${sideName(f.side)} in this opening</span></header>
  <div class="fam-layout">
    <section class="card fam-stage" aria-label="Selected line">
      <div class="fam-info">
        <div><p class="eyebrow">${sel.eco} · ${sel.uci.length} half-moves</p><h2>${lineTitle(sel)}</h2></div>
        <div class="fam-actions">${actions}</div>
      </div>
      <div class="fam-board"><div class="board-frame">${boardHTML(positions(sel)[sel.uci.length], { flipped: side === "black" })}</div></div>
      <div class="moves">${sanList(sel).map((m, k) => `<span class="mv">${k % 2 === 0 ? `<small>${k / 2 + 1}.</small>` : ""}${esc(m)}</span>`).join("")}</div>
    </section>
    <section class="card fam-vars" aria-label="All variations">
      <div class="row" style="margin-bottom:12px"><h2>All variations</h2><span class="chip plain">${list.length}</span></div>
      <label class="search" style="max-width:none;margin-bottom:12px">${icon("search")}<span class="sr">Search this opening</span><input id="fam-q" type="search" placeholder="Search variations or moves" value="${esc(ui.famQuery)}" data-input="famQuery" autocomplete="off"></label>
      <div class="var-list" role="list">${list.map((l) => `<button role="listitem" class="var ${l.id === sel.id ? "on" : ""}" data-act="select" data-line="${l.id}">
          <span class="grow"><b>${lineTitle(l)}</b><small>${l.eco} · ${l.uci.length} half-moves</small></span>${lineStatus(l)}${icon("chev", 16)}</button>`).join("") || `<div class="empty">No variation matches.</div>`}</div>
    </section>
  </div>`;
}

/* Beside the board while learning: the family's other lines, closest first (the most moves in common with this one). */
function variationsPanel(s) {
  const cur = s.line;
  const shared = (l) => { let k = 0; while (k < cur.uci.length && k < l.uci.length && l.uci[k] === cur.uci[k]) k++; return k; };
  const fam = cur.family.lines.filter((l) => l.id !== cur.id).map((l) => ({ l, k: shared(l) }))
    .sort((a, b) => b.k - a.k || a.l.uci.length - b.l.uci.length || treeOrder(a.l, b.l));
  const close = fam.slice(0, 8), others = fam.slice(8);
  const next = (fam.find((x) => !isLearned(x.l.id)) || {}).l || null;
  const item = ({ l, k }, branch) => `<li><button class="item" data-act="learn" data-line="${l.id}" data-side="${s.side}">
      <span class="grow"><b>${lineTitle(l)}</b><small>${l.eco} · ${branch && k < l.uci.length ? `branches at ${esc(moveText(l, k, Math.min(l.uci.length, k + 2)))}` : `${l.uci.length} half-moves`}</small></span>
      ${isLearned(l.id) ? `<span class="chip">${icon("check", 12)} Learned</span>` : progressFor(l.id).length ? `<span class="chip warn">In progress</span>` : l === next ? `<span class="chip warn">Suggested next</span>` : ""}${icon("chev", 16)}</button></li>`;
  return { next, html: `<section class="card" aria-label="Variations of ${esc(cur.family.name)}">
    <p class="eyebrow">VARIATIONS</p><h2>${esc(cur.family.name)}</h2>
    <p class="muted small" style="margin:6px 0 14px">Now learning: <b style="color:var(--accent)">${lineTitle(cur)}</b> · ${cur.eco}</p>
    ${close.length ? `<div class="section-title" style="margin-top:0">Closest to this line <span class="chip plain">${close.length}</span></div><ul class="list scroll">${close.map((x) => item(x, true)).join("")}</ul>`
      : `<p class="muted small" style="margin:0">This is the only line of this opening.</p>`}
    ${others.length ? `<details class="more"><summary>Other variations <span class="chip plain">${others.length}</span></summary><ul class="list scroll" style="margin-top:10px">${others.map((x) => item(x, false)).join("")}</ul></details>` : ""}
  </section>` };
}

function viewSession() {
  const s = session;
  if (!s) return `<div class="empty"><h3>No session running</h3><button class="btn primary" data-go="#/learn">Browse openings</button></div>`;
  const line = s.line, n = line.uci.length;
  const pos = currentPos(s);
  const learn = s.mode === "learn";
  const expected = s.ply < n ? line.uci[s.ply] : null;
  const yourTurn = !s.done && userTurn(s);
  const showArrow = yourTurn && expected && (learn || s.hint);
  const arrow = showArrow ? { from: expected.slice(0, 2), to: expected.slice(2, 4) } : null;
  const nextSan = expected ? positions(line)[s.ply + 1].san : null;
  const mineColor = yourTurn && !s.choiceOpen ? pos.turn : null;
  const san = sanList(line);
  const chips = san.slice(0, s.ply).map((m, k) => `<span class="mv">${k % 2 === 0 ? `<small>${k / 2 + 1}.</small>` : ""}${esc(m)}</span>`).join("");
  const upcoming = learn && !s.done ? san.slice(s.ply, s.ply + 1).map(() => `<span class="mv next">${s.ply % 2 === 0 ? `<small>${s.ply / 2 + 1}.</small>` : ""}${esc(nextSan)}</span>`).join("") : "";
  const status = s.done ? "Line complete." : s.choiceOpen ? "Choose how to continue." : yourTurn ? (learn ? `${pos.turn === "w" ? "White" : "Black"} to move. Follow the arrow, drag the piece or click it and then its square.` : `${pos.turn === "w" ? "White" : "Black"} to move. Recall the move: no hints.`) : "Opponent is replying…";
  const vp = learn ? variationsPanel(s) : null;
  let panel;
  if (s.done && learn) {
    panel = `<div class="card"><div class="done-icon">${icon("check", 26)}</div><h2>Learned and added to your repertoire.</h2>
      <p class="muted" style="margin:8px 0 0">${esc(fullName(line))} as ${sideName(s.side)}. Its first recall test is ready now, then TEMPO spaces the reviews out.</p>
      <div class="done-actions">
        <button class="btn primary full" data-act="review" data-key="${keyOf(line.id, s.side)}">${icon("repeat", 16)} Test it now without hints</button>
        ${vp.next ? `<button class="btn ghost full" data-act="learn" data-line="${vp.next.id}" data-side="${s.side}">${icon("play", 16)} Learn next: ${esc(vp.next.label)}</button>` : ""}
        <button class="btn quiet full" data-go="#/family/${line.family.i}">Back to ${esc(line.family.name)}</button>
      </div></div>`;
  } else if (s.done) {
    const r = s.result;
    const moreDue = dueEntries().length;
    panel = `<div class="card"><p class="eyebrow">REVIEW SAVED</p><span class="grade g${r.g}">${GRADES[r.g]}</span>
      <p class="muted" style="margin:12px 0 0;font-size:14px">${esc(r.reason)}</p>
      <div class="facts">
        <div class="fact"><span>Recall before</span><b>${r.before.R == null ? "first test" : `${Math.round(r.before.R * 100)}%`}</b></div>
        <div class="fact"><span>Memory strength</span><b>${r.before.S == null ? "" : `${r.before.S.toFixed(1)} → `}${r.after.toFixed(1)} d</b></div>
        <div class="fact"><span>Next review</span><b>${r.days === 1 ? "tomorrow" : `in ${r.days} days`}</b></div>
        <div class="fact"><span>On</span><b>${fmtDate(r.due)}</b></div>
      </div>
      <div class="done-actions">
        ${moreDue ? `<button class="btn primary full" data-act="review-next">${icon("play", 16)} Next review (${moreDue} left)</button>` : `<p class="muted small" style="margin:0">That was the last line due. Nice work.</p>`}
        ${r.g === 1 ? `<button class="btn ghost full" data-act="learn-restart" data-line="${line.id}" data-side="${s.side}">${icon("book", 16)} Learn this line again</button>` : ""}
        <button class="btn quiet full" data-go="#/review">Done</button>
      </div></div>`;
  } else if (s.choiceOpen) {
    panel = `<div class="card choice" role="alertdialog" aria-labelledby="choice-h"><p class="eyebrow" style="color:var(--hard)">THIS LINE IS FADING</p>
      <h2 id="choice-h">You missed a move twice.</h2>
      <p>You can go back and learn ${esc(line.label)} again with the arrows, or keep going on your own. Either way this review counts as Again, so it comes back soon.</p>
      <button class="btn primary full" data-act="choice-relearn">${icon("book", 16)} Learn this line again</button>
      <button class="btn ghost full" data-act="choice-continue">${icon("play", 16)} Continue this line</button></div>`;
  } else {
    panel = `<div class="card">
      <div class="progress-head"><span>Your progress</span><b>${Math.round(s.ply / n * 100)}%</b></div>
      <div class="bar"><i style="width:${s.ply / n * 100}%"></i></div>
      ${learn ? (yourTurn ? `<div class="next-move"><span class="icon">${icon("arrow", 24)}</span><div><span>YOUR NEXT MOVE</span><h2>${esc(nextSan)}</h2><small class="muted">${expected.slice(0, 2)} → ${expected.slice(2, 4)}</small></div></div>` : `<div class="next-move"><span class="icon">${icon("sparkle", 22)}</span><div><span>OPPONENT</span><h2>Thinking…</h2></div></div>`)
        : `<div class="next-move"><span class="icon">${icon(s.hint ? "bulb" : "repeat", 22)}</span><div><span>${s.hint ? "ONE-TIME HINT" : "NO HINTS"}</span><h2>${s.hint ? esc(nextSan) : "Recall the move"}</h2><small class="muted">${s.mistakes ? plural(s.mistakes, "mistake") + " so far" : "Mistakes: none yet"}</small></div></div>`}
      <h3 style="margin-bottom:10px">The line so far</h3>
      <div class="moves">${chips || `<span class="muted small">No moves yet.</span>`}${upcoming}</div>
      ${learn ? `<hr class="divider"><div class="row"><button class="btn sm ghost" data-act="learn-restart" data-line="${line.id}" data-side="${s.side}">${icon("restart", 15)} Restart line</button><span class="muted small">Progress is saved automatically.</span></div>` : ""}
    </div>`;
  }
  return `<button class="back" data-go="${learn ? `#/family/${line.family.i}` : "#/review"}">${icon("back", 16)} ${learn ? esc(line.family.name) : "Repeating"}</button>
  <div class="session-head"><div><p class="eyebrow">${learn ? "GUIDED LEARNING" : "REPEATING · NO HINTS"} · ${sideName(s.side)}</p><h1>${esc(line.family.name)}${line.label === "Main line" ? "" : `: ${esc(line.label)}`}</h1></div>
    <span class="badge">${s.ply} / ${n} half-moves</span></div>
  <div class="session">
    <div class="board-col"><div class="board-frame">${boardHTML(pos, { flipped: s.side === "black", arrow, interactive: !s.done, selected: s.selected, mineColor, hintSq: null })}</div>
      <p class="feedback ${s.fbClass || ""}" role="status">${esc(s.feedback || status)}</p></div>
    <div class="stack">${panel}${vp ? vp.html : ""}</div>
  </div>`;
}

/* Repeating mode: the review queue and what's coming up, as one timeline from now into the next days. */
function viewReview() {
  const entries = repEntries();
  const due = dueEntries();
  const head = `<header class="page-head"><p class="eyebrow">REPEATING MODE</p><h1>Recall without hints.</h1>
    <p class="lead">Play your side from memory. The first mistake shows the move once; a second one lets you re-learn the line or carry on.</p></header>`;
  if (!entries.length) return head + `<div class="empty"><h3>Your repertoire is empty</h3>Lines appear here automatically after you learn them.<br><button class="btn primary" data-go="#/learn">${icon("book", 16)} Learn your first line</button></div>`;
  const groups = [];
  entries.filter((e) => e.card.due > now()).sort((a, b) => a.card.due - b.card.due).forEach((e) => {
    const d = dayStart(e.card.due);
    let g = groups.find((x) => x.d === d);
    if (!g) groups.push(g = { d, list: [] });
    g.list.push(e);
  });
  const shown = groups.slice(0, 6), rest = groups.slice(6).reduce((n, g) => n + g.list.length, 0);
  const when = (d) => { const k = dayDiff(d, now()); return k <= 0 ? "Later today" : k === 1 ? "Tomorrow" : `In ${k} days`; };
  const nowNode = due.length
    ? `<div class="q-node now"><span class="q-dot"></span>
        <div class="q-when"><h2>Now</h2><span>${plural(due.length, "line")} ready · most overdue first</span><span class="spacer"></span><button class="btn primary" data-act="review-next">${icon("play", 16)} Start review</button></div>
        ${due.map((e) => memRow(e, true)).join("")}</div>`
    : `<div class="q-node now idle"><span class="q-dot"></span>
        <div class="q-when"><h2>Now</h2><span>Nothing is due. You're all caught up.</span></div>
        <p class="muted small" style="margin:0">Want to practise anyway? Pick any line below. It is graded and rescheduled the same way.</p></div>`;
  return head + `<section class="card queue" aria-label="Review queue">
    ${nowNode}
    ${shown.map((g) => `<div class="q-node later"><span class="q-dot"></span>
        <div class="q-when"><h2>${when(g.d)}</h2><span>${fmtDate(g.d, { weekday: "long", day: "numeric", month: "short" })} · ${plural(g.list.length, "line")}</span></div>
        ${g.list.map((e) => memRow(e, false)).join("")}</div>`).join("")}
    ${rest ? `<div class="q-node idle"><span class="q-dot"></span><div class="q-when"><h2>Later</h2><span>${plural(rest, "more line")} after that</span></div></div>` : ""}
  </section>`;
}

/* Repertoire (OPEN.md to-do 5), kept simple: status tabs, one search, a card per line with its memory bar,
   and one detail panel with the moves, dates, history and the two actions. */
const REP_TABS = [
  ["all", "All lines", "", "Every line you've learned, most urgent first."],
  ["due", "Review now", "var(--again)", "Your recall of these has dropped to your target. A quick review resets them."],
  ["fresh", "Fresh", "var(--good)", "Remembered well. TEMPO brings each one back before it fades."],
  ["learning", "Still learning", "var(--hard)", "Lessons you started but haven't finished. They join your repertoire when you finish."],
];
function viewRepertoire() {
  const all = repEntries(), prog = progressList();
  const head = `<header class="page-head"><p class="eyebrow">REPERTOIRE</p><h1>Your openings, at a glance.</h1>
    <p class="lead">The bar under each line is your memory of it: long and green means fresh, short and red means it's fading. Pick a line to see its moves and history.</p></header>`;
  if (!all.length && !prog.length) {
    return head + `<div class="card"><div class="steps">
      <div><span class="step-n">1</span><b>Learn a line</b><small>Follow the arrows in Learning mode.</small></div>
      <div><span class="step-n">2</span><b>It lands here</b><small>With a memory bar that slowly drains.</small></div>
      <div><span class="step-n">3</span><b>Review in time</b><small>TEMPO calls it back before you forget.</small></div></div>
      <div style="text-align:center;margin-top:18px"><button class="btn primary" data-go="#/learn">${icon("book", 16)} Learn your first line</button></div></div>`;
  }
  const isDue = (e) => e.card.due <= now();
  const counts = { all: all.length, due: all.filter(isDue).length, fresh: all.filter((e) => !isDue(e)).length, learning: prog.length };
  const q = ui.repQuery.trim().toLowerCase();
  const match = (l, side) => (!q || `${l.family.name} ${l.label} ${l.eco}`.toLowerCase().includes(q)) && (ui.repSide === "all" || side === ui.repSide);
  const tab = REP_TABS.find((t) => t[0] === ui.repTab) || REP_TABS[0];
  const items = tab[0] === "learning"
    ? prog.filter((p) => match(p.line, p.side)).map((p) => ({ id: `p:${p.k}`, p }))
    : all.filter((e) => (tab[0] === "all" || (tab[0] === "due") === isDue(e)) && match(LINE_BY_ID.get(e.lineId), e.side))
      .sort((a, b) => a.card.due - b.card.due).map((e) => ({ id: e.key, e }));
  const narrow = window.innerWidth <= 1100;   // on small screens the detail opens only when a line is picked
  const sel = items.find((x) => x.id === ui.repSel) || (narrow ? null : items[0]) || null;
  const sides = [["all", "All sides"], ["white", "White"], ["black", "Black"], ...([...all, ...prog].some((x) => x.side === "both") ? [["both", "Both"]] : [])];
  const card = (x) => {
    const on = sel && sel.id === x.id ? "on" : "";
    if (x.p) {
      const { line: l, v, side } = x.p;
      return `<button class="rcard ${on}" data-act="rep-sel" data-k="${esc(x.id)}">${boardHTML(positions(l)[v.ply], { mini: true, flipped: side === "black" })}
        <span class="rc-body"><small>${esc(l.family.name)}</small><b>${esc(l.label)}</b><span class="bar"><i style="width:${Math.round(v.ply / v.total * 100)}%"></i></span>
        <span class="rc-foot"><span class="chip warn">${v.ply}/${v.total} learned</span><span class="chip plain">${sideName(side)}</span></span></span></button>`;
    }
    const e = x.e, l = LINE_BY_ID.get(e.lineId), d = dueLabel(e);
    return `<button class="rcard ${on}" data-act="rep-sel" data-k="${esc(x.id)}">${boardHTML(positions(l)[l.uci.length], { mini: true, flipped: e.side === "black" })}
      <span class="rc-body"><small>${esc(l.family.name)}</small><b>${esc(l.label)}</b>${meter(e)}
      <span class="rc-foot"><span class="chip ${d.cls}" title="${esc(d.long)}">${d.text}</span><span class="chip plain">${sideName(e.side)}</span></span></span></button>`;
  };
  return head + `<div class="seg" role="tablist" aria-label="Filter by status">${REP_TABS.map(([id, label, dot]) => `<button role="tab" aria-selected="${tab[0] === id}" class="${tab[0] === id ? "on" : ""}" data-act="rep-tab" data-v="${id}">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${label}<span class="n">${counts[id]}</span></button>`).join("")}</div>
    <p class="tab-help">${tab[3]}</p>
    <div class="controls">
      <label class="search">${icon("search")}<span class="sr">Search your lines</span><input id="rep-q" type="search" placeholder="Search by opening, variation or ECO" value="${esc(ui.repQuery)}" data-input="repQuery" autocomplete="off"></label>
      <div class="chips">${sides.map(([v, t]) => `<button class="fchip ${ui.repSide === v ? "on" : ""}" data-act="rep-side" data-v="${v}">${t}</button>`).join("")}</div>
    </div>
    ${items.length ? `<div class="split rep-split"><div class="rep-grid">${items.map(card).join("")}</div>${sel ? repDetail(sel) : ""}</div>`
      : `<div class="empty">${tab[0] === "due" && !q ? "Nothing needs a review right now. Nice." : tab[0] === "learning" && !q ? "No unfinished lessons." : "No line matches."}</div>`}`;
}
function repDetail(x) {
  if (x.p) {
    const { line: l, v, side } = x.p;
    return `<aside class="card detail" aria-label="Selected lesson">
      <p class="eyebrow">${esc(l.family.name)} · ${l.eco}</p><h2>${esc(l.label)}</h2>
      <div class="big-status"><b>Lesson in progress</b><small>${v.ply} of ${v.total} half-moves learned · playing ${sideName(side)} · last opened ${fmtDate(v.at)}</small><span class="bar" style="margin-top:10px"><i style="width:${Math.round(v.ply / v.total * 100)}%"></i></span></div>
      <div class="detail-actions"><button class="btn primary" data-act="learn" data-line="${l.id}" data-side="${side}">${icon("play", 16)} Continue lesson</button>
        <button class="btn ghost" data-act="learn-restart" data-line="${l.id}" data-side="${side}">${icon("restart", 16)} Start over</button></div>
      <div class="detail-board"><div class="board-frame">${boardHTML(positions(l)[v.ply], { flipped: side === "black" })}</div></div>
      <div class="moves">${sanList(l).map((m, i) => `<span class="mv ${i >= v.ply ? "ghost" : ""}">${i % 2 === 0 ? `<small>${i / 2 + 1}.</small>` : ""}${i >= v.ply ? "?" : esc(m)}</span>`).join("")}</div></aside>`;
  }
  const e = x.e, l = LINE_BY_ID.get(e.lineId), d = dueLabel(e), last = e.history[e.history.length - 1];
  const maxDays = Math.max(1, ...e.history.map((h) => h.days || 0));
  return `<aside class="card detail" aria-label="Selected line">
    <p class="eyebrow">${esc(l.family.name)} · ${l.eco}</p><h2>${esc(l.label)}</h2>
    <div class="big-status"><b>${esc(d.long)}</b>${meter(e)}<small>${recallText(e)} · playing ${sideName(e.side)}</small></div>
    <div class="detail-actions"><button class="btn primary" data-act="review" data-key="${e.key}">${icon("repeat", 16)} ${e.card.due <= now() ? "Review now" : "Practise early"}</button>
      <button class="btn ghost" data-act="learn-restart" data-line="${l.id}" data-side="${e.side}">${icon("book", 16)} Learn again</button></div>
    <div class="detail-board"><div class="board-frame">${boardHTML(positions(l)[l.uci.length], { flipped: e.side === "black" })}</div></div>
    <div class="moves">${sanList(l).map((m, i) => `<span class="mv">${i % 2 === 0 ? `<small>${i / 2 + 1}.</small>` : ""}${esc(m)}</span>`).join("")}</div>
    <div class="facts">
      <div class="fact"><span>Learned</span><b>${fmtDate(e.learnedAt, { day: "numeric", month: "short" })}</b></div>
      <div class="fact"><span>Last review</span><b>${last ? `${fmtDate(last.at, { day: "numeric", month: "short" })} <span class="gt${last.g}">${GRADES[last.g]}</span>` : "Not yet"}</b></div>
      <div class="fact"><span>Next review</span><b>${e.card.due <= now() ? "Now" : fmtDate(e.card.due, { day: "numeric", month: "short" })}</b></div>
      <div class="fact"><span>Memory strength</span><b>${e.card.S == null ? "Not measured" : `${e.card.S.toFixed(1)} days`}</b></div>
    </div>
    <h3>How its memory grew</h3>
    ${e.history.length ? `<ul class="hist">${e.history.map((h) => `<li><span>${fmtDate(h.at, { day: "numeric", month: "short" })}</span><span class="grade g${h.g}">${GRADES[h.g]}</span>
        <span class="gap">${h.days ? `<i style="width:${Math.max(4, h.days / maxDays * 55)}%"></i>next in ${plural(h.days, "day")}` : ""}</span></li>`).join("")}</ul>`
      : `<p class="muted small" style="margin:6px 0 0">No reviews yet. The first recall test starts the memory clock.</p>`}</aside>`;
}
const PREVIEW_LINE = { uci: "e2e4 e7e5 g1f3 b8c6 f1c4 f8c5 c2c3 g8f6".split(" ") };
function viewSettings() {
  const t = THEMES.find((x) => x.id === store.theme) || THEMES[0], p = PIECE_SETS.find((x) => x.id === store.pieces) || PIECE_SETS[0];
  const sample = (set) => [["w", "k", "l"], ["b", "q", "d"], ["w", "n", "d"], ["b", "n", "l"]]
    .map(([c, tp, sq]) => `<span class="s ${sq}">${pieceHTML({ c, t: tp }, set)}</span>`).join("");
  return `<header class="page-head"><p class="eyebrow">SETTINGS</p><h1>Make TEMPO yours.</h1>
    <p class="lead">Pick a theme and a piece set. The pieces take on the colours of the theme.</p></header>
  <section class="card"><div class="appearance">
    <div class="ap-preview"><div class="board-frame">${boardHTML(positions(PREVIEW_LINE)[PREVIEW_LINE.uci.length], { arrow: { from: "e1", to: "g1" } })}</div>
      <p class="muted small"><b style="color:var(--ink)">${t.name}</b> theme with <b style="color:var(--ink)">${p.name}</b> pieces · Italian Game</p>
      <button class="btn ghost" data-act="surprise">${icon("sparkle", 16)} Surprise me</button></div>
    <div>
      <h2 class="ap-title">${icon("palette")} Theme</h2><p class="ap-sub">Colours for the whole app, the board and the pieces.</p>
      <div class="themes">${THEMES.map((x) => `<button class="theme ${store.theme === x.id ? "on" : ""}" data-act="theme" data-v="${x.id}" aria-pressed="${store.theme === x.id}">
        <span class="theme-board">${[0, 1, 2, 3].map((k) => `<i style="background:${x.board[k % 2]}"><img src="${pieceURI(store.pieces, ["wK", "bQ", "wN", "bN"][k], x.id)}" alt=""></i>`).join("")}</span>
        <b>${x.name}</b><small>${x.note}</small></button>`).join("")}</div>
      <h2 class="ap-title" style="margin-top:26px">${icon("crown")} Pieces</h2><p class="ap-sub">Every set is recoloured to match the theme you pick.</p>
      <div class="themes">${PIECE_SETS.map((s) => `<button class="theme ${store.pieces === s.id ? "on" : ""}" data-act="pieces" data-v="${s.id}" aria-pressed="${store.pieces === s.id}">
        <span class="pset-board">${sample(s.id)}</span><b>${s.name}</b><small>${s.note}</small></button>`).join("")}</div>
      <p class="credits">Piece sets from the Lichess project, recoloured: Classic by Colin M.L. Burnett and Merida by Armando Hernandez Marroquin (GPLv2+); Chessnut by Alexis Luengas (Apache 2.0); Spatial and Celtic by Maurizio Monge (MIT); Chunky by RhosGFX (CC0).</p>
    </div>
  </div></section>`;
}

/* ---------------- render ---------------- */
function render() {
  document.documentElement.dataset.theme = store.theme;
  const { view, arg } = route();
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = focusId && "selectionStart" in active ? active.selectionStart : null;
  let content;
  switch (view) {
    case "learn": content = viewLearn(); break;
    case "family": content = viewFamily(arg); break;
    case "session": content = viewSession(); break;
    case "review": content = viewReview(); break;
    case "repertoire": content = viewRepertoire(); break;
    case "settings": content = viewSettings(); break;
    default: content = viewHome();
  }
  document.getElementById("app").innerHTML = shell(view, content);
  document.title = `TEMPO · ${({ learn: "Learning", family: "Learning", session: session?.mode === "review" ? "Repeating" : "Learning", review: "Repeating", repertoire: "Repertoire", settings: "Settings" })[view] || "Dashboard"}`;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch { /* not a text field */ } }
  }
}

/* ---------------- events ---------------- */
let lastView = null;
document.addEventListener("click", (ev) => {
  if (suppressClick) { suppressClick = false; return; }
  const goEl = ev.target.closest("[data-go]");
  if (goEl) { go(goEl.dataset.go); return; }
  const sqEl = ev.target.closest('[data-board="play"] [data-sq]');
  if (sqEl) { clickSquare(sqEl.dataset.sq); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case "learn": startLearning(Number(d.line), d.side); break;
    case "learn-restart": startLearning(Number(d.line), d.side, { restart: true }); break;
    case "review": startReview(d.key); break;
    case "review-next": { const due = dueEntries(); if (due.length) startReview(due[0].key); else go("#/review"); break; }
    case "side-filter": store.side = d.v; save(); render(); break;
    case "select": ui.selected = Number(d.line); render(); break;
    case "tl-day": ui.tlDay = d.d && ui.tlDay !== Number(d.d) ? Number(d.d) : null; render(); break;
    case "rep-tab": ui.repTab = d.v; ui.repSel = null; render(); break;
    case "rep-side": ui.repSide = d.v; render(); break;
    case "rep-sel":
      ui.repSel = d.k; render();
      if (window.innerWidth <= 1100) document.querySelector(".detail")?.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    case "theme": store.theme = d.v; save(); render(); toast(`Board: ${THEMES.find((t) => t.id === d.v).name}`); break;
    case "pieces": store.pieces = d.v; save(); render(); toast(`Pieces: ${PIECE_SETS.find((p) => p.id === d.v).name}`); break;
    case "surprise": {
      const pick = (list, cur) => { const rest = list.filter((x) => x.id !== cur); return rest[Math.floor(Math.random() * rest.length)].id; };
      store.theme = pick(THEMES, store.theme); store.pieces = pick(PIECE_SETS, store.pieces); save(); render();
      toast(`${THEMES.find((t) => t.id === store.theme).name} board with ${PIECE_SETS.find((p) => p.id === store.pieces).name} pieces`);
      break;
    }
    case "choice-relearn": {
      const s = session;
      recordReview(s, true);
      toast("Review saved as Again. Let's learn it again.");
      startLearning(s.line.id, s.side, { restart: true });
      break;
    }
    case "choice-continue": session.choiceOpen = false; session.feedback = "Keep going. No more hints in this line."; session.fbClass = ""; session.turnStart = performance.now(); render(); break;
  }
});
document.addEventListener("input", (ev) => {
  const key = ev.target.dataset.input;
  if (!key) return;
  if (key === "name") { store.name = ev.target.value.trim() || "Player"; save(); return; }
  ui[key] = ev.target.value;
  if (key === "famQuery") ui.selected = ui.selected;
  render();
});
document.addEventListener("change", (ev) => {
  const key = ev.target.dataset.change;
  if (!key) return;
  if (key === "retention") { store.retention = Number(ev.target.value); save(); }
  else if (key === "name") { /* handled on input */ }
  else ui[key] = ev.target.value;
  if (key === "name") return;
  render();
});
document.addEventListener("keydown", (ev) => {
  const sqEl = ev.target.closest && ev.target.closest('[data-board="play"] [data-sq]');
  if (sqEl && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); clickSquare(sqEl.dataset.sq); }
});
window.addEventListener("hashchange", () => { if (route().view !== lastView) { lastView = route().view; window.scrollTo(0, 0); } });

function clickSquare(sq) {
  const s = session;
  if (!s || s.done || !userTurn(s) || s.choiceOpen) return;
  const pos = currentPos(s);
  const p = pos.board[sq];
  if (p && p.c === pos.turn) { s.selected = s.selected === sq ? null : sq; render(); return; }
  if (s.selected) tryMove(s.selected, sq);
}

/* drag and drop with mouse, pen or touch */
let drag = null, suppressClick = false;
document.addEventListener("pointerdown", (ev) => {
  const sqEl = ev.target.closest('[data-board="play"] [data-sq]');
  const s = session;
  if (!sqEl || !s || s.done || !userTurn(s) || s.choiceOpen || ev.button !== 0) return;
  const pos = currentPos(s);
  const p = pos.board[sqEl.dataset.sq];
  if (!p || p.c !== pos.turn) return;
  if (ev.pointerType === "mouse") ev.preventDefault();
  drag = { from: sqEl.dataset.sq, x: ev.clientX, y: ev.clientY, moved: false, glyph: sqEl.querySelector(".pc"), size: sqEl.getBoundingClientRect().width };
});
document.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 5) return;
  if (!drag.moved) {
    drag.moved = true;
    drag.ghost = drag.glyph.cloneNode(true);
    drag.ghost.classList.add("drag-ghost");
    drag.ghost.style.width = drag.ghost.style.height = `${drag.size}px`;
    document.body.appendChild(drag.ghost);
    drag.glyph.classList.add("lifted");
    document.body.classList.add("dragging");
  }
  drag.ghost.style.left = `${ev.clientX}px`;
  drag.ghost.style.top = `${ev.clientY}px`;
  const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-board="play"] [data-sq]');
  document.querySelectorAll(".sq.drop").forEach((e) => e.classList.remove("drop"));
  if (over && over.dataset.sq !== drag.from) over.classList.add("drop");
});
function endDrag(ev, cancelled) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (!d.moved) return;          // a plain click: the click handler selects the piece
  d.ghost.remove();
  document.body.classList.remove("dragging");
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  const over = cancelled ? null : document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-board="play"] [data-sq]');
  if (over && over.dataset.sq !== d.from) tryMove(d.from, over.dataset.sq);
  else render();
}
document.addEventListener("pointerup", (ev) => endDrag(ev, false));
document.addEventListener("pointercancel", (ev) => endDrag(ev, true));

/* first paint */
if (route().view === "session") location.hash = "#/home";
lastView = route().view;
render();
</script>
</body>
</html>
